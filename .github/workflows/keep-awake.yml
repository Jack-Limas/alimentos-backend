name: Keep awake (opt-in)

# Render's free services sleep after ~15 minutes without traffic. This pings
# GET /health every 14 minutes from 06:00 to 22:00 in Bogota (11:00-03:00 UTC),
# about 16 h a day: ~480 of the 750 free instance-hours a month, leaving room
# for alimentos-ai. Pinging 24/7 would use ~720 h and could suspend every free
# service of the account before the month ends.
#
# Opt-in: it does nothing until the repository variable KEEP_AWAKE_URL is set
# (Settings → Secrets and variables → Actions → Variables), e.g. the backend
# origin. /health never triggers the daily demo refresh (only a login or
# GET /public/impact do), so these pings change no data.

on:
  schedule:
    - cron: '*/14 11-23 * * *'
    - cron: '*/14 0-2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          URL: ${{ vars.KEEP_AWAKE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "KEEP_AWAKE_URL is not set: nothing to do."
            exit 0
          fi
          # A sleeping service can take about a minute to answer.
          curl -fsS --max-time 120 --retry 2 --retry-delay 10 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "${URL%/}/health"
